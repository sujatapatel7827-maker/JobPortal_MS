<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AI JobPortal</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav>
        <a href="/" class="logo">AI JobPortal</a>
    </nav>
    <main class="container">
        <div class="glass auth-form">
            <h2 style="margin-bottom: 2rem; text-align: center;">Welcome Back</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" required placeholder="john@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Sign In</button>
                <p style="text-align: center; margin-top: 1.5rem; color: var(--text-muted);">
                    Don't have an account? <a href="/register.html" style="color: var(--primary); text-decoration: none;">Register</a>
                </p>
            </form>
        </div>
    </main>

    <script src="/js/api.js"></script>
    <script>
        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const data = {
                email: e.target.email.value,
                password: e.target.password.value
            };
            
            const res = await api.post('/auth/login', data);
            if (res.token) {
                localStorage.setItem('token', res.token);
                localStorage.setItem('user', JSON.stringify({ name: res.name, role: res.role }));
                // Get user ID after login (need to modify backend slightly or fetch profile)
                const profile = await api.get('/user/profile');
                localStorage.setItem('user', JSON.stringify(profile.user));
                window.location.href = '/dashboard.html';
            } else {
                alert(res.message || 'Login failed');
            }
        };
    </script>
</body>
</html>
