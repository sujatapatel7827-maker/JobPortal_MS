<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Details | AI JobPortal</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav>
        <a href="/" class="logo">AI JobPortal</a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/jobs.html">Jobs</a>
            <a href="/dashboard.html">Dashboard</a>
        </div>
    </nav>

    <main class="container">
        <div id="jobContent" class="glass" style="max-width: 900px; margin: 2rem auto;">
            <!-- Content loaded here -->
        </div>
    </main>

    <script src="/js/api.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const jobId = urlParams.get('id');

        async function loadJob() {
            const job = await api.get(`/jobs/${jobId}`);
            const user = JSON.parse(localStorage.getItem('user'));
            
            const content = document.getElementById('jobContent');
            content.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2rem;">
                    <div>
                        <h1 style="margin-bottom: 0.5rem">${job.title}</h1>
                        <p style="color: var(--primary); font-size: 1.5rem; font-weight: 700">${job.company}</p>
                        <p style="color: var(--text-muted); margin-top: 0.5rem">${job.location} • ${job.salary}</p>
                    </div>
                    ${job.matchScore ? `
                        <div style="text-align: right;">
                            <div class="match-badge" style="font-size: 1.2rem; padding: 0.8rem 1.5rem;">${job.matchScore}% AI Match</div>
                            <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 0.5rem;">Based on your skills</p>
                            ${job.matchReason ? `<p style="font-size: 0.85rem; color: var(--primary); font-style: italic; max-width: 250px; margin-top: 0.5rem;">"${job.matchReason}"</p>` : ''}
                        </div>
                    ` : ''}
                </div>

                <div style="margin-bottom: 2.5rem;">
                    <h3 style="margin-bottom: 1rem;">Required Skills</h3>
                    <div style="display: flex; flex-wrap: wrap; gap: 0.5rem;">
                        ${job.requirements.split(',').map(s => `<span class="tag" style="padding: 0.5rem 1rem;">${s.trim()}</span>`).join('')}
                    </div>
                </div>

                <div style="margin-bottom: 2.5rem;">
                    <h3 style="margin-bottom: 1rem;">Job Description</h3>
                    <div style="color: var(--text-muted); white-space: pre-wrap; line-height: 1.8;">${job.description}</div>
                </div>

                <div style="border-top: 1px solid var(--border); padding-top: 2rem; display: flex; gap: 1rem;">
                    ${user && user.role === 'applicant' ? `
                        <button onclick="applyForJob()" class="btn btn-primary" style="padding: 1rem 3rem;">Apply Now</button>
                    ` : user ? `<p style="color: var(--text-muted)">Login as Job Seeker to apply</p>` : `<a href="/login.html" class="btn btn-primary">Login to Apply</a>`}
                </div>
            `;
        }

        async function applyForJob() {
            const res = await api.post(`/jobs/${jobId}/apply`);
            if (res.message) {
                alert('Application submitted successfully!');
                window.location.href = '/dashboard.html';
            } else {
                alert(res.error || 'Application failed');
            }
        }

        loadJob();
    </script>
</body>
</html>
